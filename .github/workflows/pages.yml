name: Publish static frontend to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "src/musicstream/static/**"
      - "scripts/build_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build only public static files
        env:
          API_BASE_URL: ${{ vars.MUSICSTREAM_API_BASE_URL }}
        run: python scripts/build_pages.py --api-base-url "$API_BASE_URL"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the static artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
