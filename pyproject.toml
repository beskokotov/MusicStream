[project]
name = "musicstream"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "beskokotov", email = "beskokotov@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
musicstream = "musicstream:main"

[project.optional-dependencies]
hitmos = [
    "playwright>=1.49",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
